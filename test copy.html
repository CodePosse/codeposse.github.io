<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>:root {
  --rx: 0; --ry: 0; --tx: 0; --ty: 0;
}

body {
  margin: 0; background: #08080c; font-family: system-ui, sans-serif;
  overflow: hidden; width: 100vw; height: 100vh;
}

.tour-container {
  width: 100%; height: 100%; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}

/* Room Selection Navigation Menu */
.studio-nav {
  position: absolute; top: 40px; z-index: 100; display: flex; gap: 15px;
}
.studio-nav button {
  background: rgba(255,255,255,0.05); color: #8c92ac; border: 1px solid rgba(255,255,255,0.1);
  padding: 10px 20px; border-radius: 30px; cursor: pointer; transition: all 0.3s ease;
}
.studio-nav button.active, .studio-nav button:hover {
  background: #fff; color: #000; box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

/* 3D Camera / Eye Viewport */
.viewport {
  width: 1024px; height: 680px; perspective: 1400px;
}

.scene {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d;
  transform: rotateX(calc(var(--rx) * 1deg)) rotateY(calc(var(--ry) * 1deg));
}

/* Visibility toggling for room states */
.room {
  position: absolute; width: 100%; height: 100%; 
  transform-style: preserve-3d; display: none;
}
.room.active { display: block; }

/* Structural layer guidelines */
.layer {
  position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  will-change: transform;
}

/* --- THE PERSPECTIVE DEPTH LAYERING EXPRESSION --- */
[class^="layer bg-"] {
  transform: translateZ(10px) scale(0.95);
}
[class^="layer mid-"] {
  transform: translateZ(90px) translate(calc(var(--tx) * 0.25px), calc(var(--ty) * 0.25px)) scale(1.05);
}
[class^="layer fg-"] {
  transform: translateZ(180px) translate(calc(var(--tx) * 0.6px), calc(var(--ty) * 0.6px)) scale(1.15);
}

/* Placeholder styles linking to your asset variations */
.bg-warehouse { background-image: url('room1-bg.jpg'); }
.mid-cart     { background-image: url('room1-mid.png'); } /* Must have transparent background! */
.fg-cables    { background-image: url('room1-fg.png');  } /* Must have transparent background! */
</style>>
</head>
<body>
<!-- The Global Tour Framework -->
<div class="tour-container">
  
  <!-- Navigation Controls to jump between rooms -->
  <nav class="studio-nav">
    <button onclick="switchRoom(1)" class="active">01. DIT Hub</button>
    <button onclick="switchRoom(2)">02. Cyclorama Stage</button>
    <button onclick="switchRoom(3)">03. Active Shoot</button>
    <button onclick="switchRoom(4)">04. Styling Closet</button>
  </nav>

  <!-- The Active 3D Window Viewport -->
  <div class="viewport">
    <div class="scene" id="studioScene">
      
      <!-- ROOM 1: THE DIT HUB (Active by default) -->
      <div class="room active" id="room-1">
        <div class="layer bg-warehouse"></div>
        <div class="layer mid-cart"></div>
        <div class="layer fg-cables"></div>
      </div>

      <!-- ROOM 2: CYCLORAMA LIGHT STAGE -->
      <div class="room" id="room-2">
        <div class="layer bg-truss"></div>
        <div class="layer mid-strobes"></div>
        <div class="layer fg-gearbag"></div>
      </div>

      <!-- ROOM 3: THE LIVE FASHION SHOOT -->
      <div class="room" id="room-3">
        <div class="layer bg-loft"></div>
        <div class="layer mid-model"></div>
        <div class="layer fg-crew"></div>
      </div>

      <!-- ROOM 4: WARDROBE & PREP BAY -->
      <div class="room" id="room-4">
        <div class="layer bg-brick"></div>
        <div class="layer mid-rack"></div>
        <div class="layer fg-steamer"></div>
      </div>

    </div>
  </div>
</div>

<script>

  let targetX = 0; let targetY = 0;
let currentX = 0; let currentY = 0;
const lerpFactor = 0.06;

// Gather real-time cursor values
document.addEventListener('mousemove', (e) => {
  targetX = e.clientX - (window.innerWidth / 2);
  targetY = e.clientY - (window.innerHeight / 2);
});

// The Animation Engine Loop
function updateParallax() {
  currentX += (targetX - currentX) * lerpFactor;
  currentY += (targetY - currentY) * lerpFactor;

  const scene = document.getElementById('studioScene');
  if (scene) {
    const rx = -(currentY / (window.innerHeight / 2)) * 12;
    const ry = (currentX / (window.innerWidth / 2)) * 12;

    scene.style.setProperty('--rx', rx.toFixed(2));
    scene.style.setProperty('--ry', ry.toFixed(2));
    scene.style.setProperty('--tx', currentX.toFixed(2));
    scene.style.setProperty('--ty', currentY.toFixed(2));
  }
  requestAnimationFrame(updateParallax);
}
updateParallax();

// State-switching room navigation logic
function switchRoom(roomNumber) {
  // Update button presentation states
  document.querySelectorAll('.studio-nav button').forEach((btn, idx) => {
    btn.classList.toggle('active', idx === (roomNumber - 1));
  });
  
  // Show / Hide targeted layers smoothly
  document.querySelectorAll('.room').forEach(room => room.classList.remove('active'));
  document.getElementById(`room-${roomNumber}`).classList.add('active');
}

</script>
</body>
</html>
